// State
let history = [];

function render() {
  const app = document.getElementById("app");

  if (history.length === 0) {
    renderNode(tree);
    return;
  }

  const current = history[history.length - 1];
  const node = nodes[current];

  if (!node) {
    app.innerHTML = '<p>Something went wrong. <button class="restart-btn" onclick="restart()">Start over</button></p>';
    return;
  }

  if (node.result) {
    renderResult(node);
  } else {
    renderNode(node);
  }
}

function renderNode(node) {
  const app = document.getElementById("app");
  const crumbs = buildBreadcrumbs();

  app.innerHTML = `
    ${crumbs}
    <div class="question">${node.question}</div>
    <div class="options">
      ${node.options.map(o => `
        <button class="option-btn" onclick="choose('${o.next}')">
          <span class="opt-icon">${o.icon}</span>
          <span>${o.label}</span>
        </button>
      `).join("")}
    </div>
  `;
}

function renderResult(node) {
  const app = document.getElementById("app");
  const info = BIN_INFO[node.bin];
  const crumbs = buildBreadcrumbs();

  app.innerHTML = `
    <div class="result">
      ${crumbs}
      <div class="result-icon">${info.icon}</div>
      <div class="result-bin ${node.bin}">${info.label}</div>
      <span class="result-bag ${node.bin}">${info.bag}</span>
      <p class="result-detail">${node.detail}</p>
      <div class="result-pickup">
        <strong>Pickup day:</strong> ${info.pickup}
      </div>
      <div class="btn-row">
        <button class="restart-btn" onclick="restart()">Sort another item</button>
        <a href="index.html" class="guide-btn restart-btn" style="background:#e0e0e0;color:#333;">Full guide</a>
      </div>
    </div>
  `;
}

function buildBreadcrumbs() {
  if (history.length === 0) return "";
  let html = '<div class="breadcrumb">';
  html += `<span class="crumb" style="cursor:pointer;text-decoration:underline;" onclick="restart()">Start</span>`;
  history.forEach((id, i) => {
    html += `<span class="crumb-sep">&#8250;</span>`;
    const isLast = i === history.length - 1;
    if (isLast) {
      html += `<span class="crumb active">${getNodeLabel(id)}</span>`;
    } else {
      html += `<span class="crumb" style="cursor:pointer;text-decoration:underline;" onclick="goBack(${i + 1})">${getNodeLabel(id)}</span>`;
    }
  });
  html += '</div>';
  return html;
}

function getNodeLabel(id) {
  const n = nodes[id];
  if (!n) return id;
  if (n.result) return BIN_INFO[n.bin].label;
  return n.question.length > 30 ? n.question.slice(0, 28) + "..." : n.question;
}

function choose(nextId) {
  history.push(nextId);
  render();
}

function goBack(toIndex) {
  history = history.slice(0, toIndex);
  render();
}

function restart() {
  history = [];
  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").innerHTML = "";
  render();
}

function showItemResult(item) {
  const info = BIN_INFO[item.bin];
  const app = document.getElementById("app");
  history = ["search"];

  app.innerHTML = `
    <div class="result">
      <div class="result-icon">${info.icon}</div>
      <div class="result-bin ${item.bin}">${info.label}</div>
      <span class="result-bag ${item.bin}">${info.bag}</span>
      <p class="result-detail"><strong>${item.name}</strong> &mdash; ${item.tip}</p>
      <div class="result-pickup">
        <strong>Pickup day:</strong> ${info.pickup}
      </div>
      <div class="btn-row">
        <button class="restart-btn" onclick="restart()">Sort another item</button>
        <a href="index.html" class="guide-btn restart-btn" style="background:#e0e0e0;color:#333;">Full guide</a>
      </div>
    </div>
  `;
}

// Search
document.getElementById("searchInput").addEventListener("input", function(e) {
  const q = e.target.value.toLowerCase().trim();
  const resultsDiv = document.getElementById("searchResults");

  if (q.length < 2) {
    resultsDiv.innerHTML = "";
    return;
  }

  const matches = ITEMS.filter(item =>
    item.name.toLowerCase().includes(q)
  ).slice(0, 8);

  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div style="padding:0.5rem;color:#999;font-size:0.9rem;">No matches found. Try the questions below.</div>';
    return;
  }

  resultsDiv.innerHTML = matches.map(item => {
    const info = BIN_INFO[item.bin];
    return `
      <div class="search-result-item" onclick='showItemResult(${JSON.stringify(item).replace(/'/g, "\\'")})'>
        <span class="search-item-name">${item.name}</span>
        <span class="search-item-bin ${item.bin}">${info.label}</span>
      </div>
    `;
  }).join("");
});

// Init
render();
</script>
